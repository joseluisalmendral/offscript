[project]
name = "grab-transcriber"
version = "1.1.0"
description = "Transcribe or download audio, video and transcripts from local files or 1800+ sites, powered by local Whisper."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "joseluis.fernandez" }]
keywords = ["whisper", "transcription", "speech-to-text", "yt-dlp", "ffmpeg", "faster-whisper", "cli"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Multimedia :: Video",
]

[project.urls]
Homepage = "https://github.com/joseluisalmendral/transcriptor"
Issues = "https://github.com/joseluisalmendral/transcriptor/issues"

[project.scripts]
grab = "grab:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["grab.py"]
